// 自動ステータス計算
function calcAutoStatus(c) {
  if(c['ステータス']==='キャンセル') return 'キャンセル';
  // 1. エントリー未完了
  if(!c['エントリー_状況']||c['エントリー_状況']!=='提出済') return 'エントリー予定';
  // 2. 事前提出が必要な提出物が未提出 → 準備中
  var submPending=false;
  if(c['音源_要否']==='事前'&&c['音源_状況']!=='提出済') submPending=true;
  if(c['動画_要否']&&c['動画_要否']!=='不要'&&c['動画_状況']!=='提出済') submPending=true;
  if(c['写真_要否']&&c['写真_要否']!=='不要'&&c['写真_状況']!=='提出済') submPending=true;
  if(submPending) return '準備中';
  // 日付計算
  var cd=c['開催日']?new Date(c['開催日']):null;
  var now=new Date(); now.setHours(0,0,0,0);
  var afterContest=cd&&cd<now;
  // 3. 未払い判定
  var efAmt=parseInt(c['エントリー費_金額'])||0;
  var adultP=parseInt(c['観覧費_大人_単価'])||0, childP=parseInt(c['観覧費_子供_単価'])||0;
  var tTotal=(parseInt(c['交通費_ガソリン代'])||0)+(parseInt(c['交通費_ETC'])||0);
  var unpaid=false;
  S.fams.forEach(function(fam){
    if(efAmt>0&&!parseBool(c[fam+'_エントリー費_支払済'])) unpaid=true;
    var ad=parseInt(c[fam+'_観覧費_大人'])||0, ch=parseInt(c[fam+'_観覧費_子供'])||0;
    var kanFree=(c['観覧費_支払方法']==='不要');
    var freeOne=parseBool(c['観覧費_付き添い無料']);
    var effAdAmt=ad>0?adultP*(freeOne?Math.max(0,ad-1):ad):0;
    var effChAmt=ch>0?childP*ch:0;
    if(!kanFree&&(effAdAmt>0||effChAmt>0)&&!parseBool(c[fam+'_観覧費_支払済'])) unpaid=true;
    if(tTotal>0&&parseBool(c[fam+'_交通費_対象'])&&!parseBool(c[fam+'_交通費_支払済'])) unpaid=true;
  });
  // 4. 大会後かつ未払い → 会計待ち
  if(afterContest&&unpaid) return '会計待ち';
  // 5. 大会前で当日対応が残っている → 当日待ち
  var dayOf=false;
  if(c['音源_要否']==='当日CD') dayOf=true;
  if(efAmt>0&&c['エントリー費_支払方法']==='当日') dayOf=true;
  if(c['観覧費_支払方法']==='当日支払い') dayOf=true;
  if(!afterContest&&dayOf) return '当日待ち';
  // 6. 大会前で未払い（振込等）→ 準備中
  if(!afterContest&&unpaid) return '準備中';
  return '完了';
}

function renderContests() {
  var el=document.getElementById('clist');
  if(!el) return;
  var emptyHtml='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg><p style="margin-bottom:12px">大会がまだありません</p><button onclick="openNew()" style="padding:10px 24px;border-radius:999px;background:var(--Y);color:#fff;font-size:14px;font-weight:700;border:none">＋ 大会を追加</button></div>';
  var all=S.contests.filter(function(c){ return c['コンテスト名']; });
  if(!all.length){ el.innerHTML=emptyHtml; renderTodayBanner([]); return; }
  // Search filter
  if(S.search){
    var q=S.search.toLowerCase();
    all=all.filter(function(c){
      return (c['コンテスト名']||'').toLowerCase().indexOf(q)>=0||
             (c['会場']||'').toLowerCase().indexOf(q)>=0||
             (c['部門']||'').toLowerCase().indexOf(q)>=0;
    });
    if(!all.length){ el.innerHTML='<div class="empty"><p>「'+esc(S.search)+'」に一致する大会はありません</p></div>'; renderTodayBanner([]); return; }
  }
  var f=S.filter;
  var now0=new Date(); now0.setHours(0,0,0,0);
  if(f!=='all'){
    var list=all.filter(function(c){ return calcAutoStatus(c)===f; });
    if(!list.length){ el.innerHTML=emptyHtml; renderTodayBanner([]); return; }
    list.sort(function(a,b){ return new Date(a['開催日']||'9999')-new Date(b['開催日']||'9999'); });
    el.innerHTML=list.map(mkCard).join('');
    renderTodayBanner(all);
    return;
  }
  // 全表示：完了以外を日付昇順、完了をセクション区切りで下段
  var active=[], done=[];
  all.forEach(function(c){ (calcAutoStatus(c)==='完了'?done:active).push(c); });
  active.sort(function(a,b){ return new Date(a['開催日']||'9999')-new Date(b['開催日']||'9999'); });
  done.sort(function(a,b){ return new Date(b['開催日']||'0')-new Date(a['開催日']||'0'); });
  var html=active.map(mkCard).join('');
  if(done.length){
    html+='<div style="margin:18px 0 12px;display:flex;align-items:center;gap:8px">';
    html+='<div style="flex:1;height:0.5px;background:var(--BD)"></div>';
    html+='<span style="font-size:11px;font-weight:600;color:var(--MU);white-space:nowrap;letter-spacing:.04em">完了済み</span>';
    html+='<div style="flex:1;height:0.5px;background:var(--BD)"></div></div>';
    html+=done.map(mkCard).join('');
  }
  if(!active.length&&!done.length){ el.innerHTML=emptyHtml; renderTodayBanner([]); return; }
  el.innerHTML=html;
  renderTodayBanner(all);
}

function mkCard(c) {
  var autoStat=calcAutoStatus(c);
  var bm={'エントリー予定':'b-entry','準備中':'b-ready','当日待ち':'b-dayof','会計待ち':'b-waitpay','完了':'b-done','キャンセル':'b-cancel'};
  var bc=bm[autoStat]||'b-def';
  var finalStat=c['ラウンド']==='決勝'?(c['決勝_ステータス']||''):'';
  var finalBadge=finalStat==='決勝予定'?'<span class="badge b-final-plan">決勝予定</span>':
    (finalStat==='進出決定'?'<span class="badge b-final-confirmed">決勝進出</span>':'');
  // 今後7日以内の大会はupcomingクラス
  var isUpcoming=false;
  if(c['開催日']&&autoStat!=='完了'&&autoStat!=='キャンセル'){
    var cd=new Date(c['開催日']); var n0=new Date(); n0.setHours(0,0,0,0);
    var dff=Math.ceil((cd-n0)/86400000);
    isUpcoming=(dff>=0&&dff<=7);
  }
  var meta='<span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'+(c['開催日']?fmtD(c['開催日']):'日程未定')+'</span>';
  if(c['会場']) {
    meta+='<span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'+esc(c['会場'])+'</span>';
  }
  if(c['部門']) meta+='<span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>'+esc(c['部門'])+'</span>';
  if(c['大会シリーズ名']) meta+='<span class="mi">シリーズ: '+esc(c['大会シリーズ名'])+'</span>';
  var tp=[];
  if(c['集合時間']) tp.push('集合 '+c['集合時間']);
  if(c['開始時間']){ var tStr='開始 '+c['開始時間']; if(c['終了時間']) tStr+='〜'+c['終了時間']; tp.push(tStr); }
  if(c['出演順番']) tp.push('出演順 '+c['出演順番']+(c['総組数']?'/'+c['総組数']+'組':'')+'番目');
  var tc=tp.length?'<div class="cc-times">'+tp.join('　')+'</div>':'';
  var fmtTag=c['開催形式']==='オンライン'?'<span class="fmt-tag">オンライン</span>':'';
  var dlNear=false;
  var dls=[c['エントリー_期限'],c['エントリー費_期限'],c['音源_期限'],c['動画_期限'],c['写真_期限']];
  for(var di=0;di<dls.length;di++){ if(isNearDeadline(dls[di])){ dlNear=true; break; } }
  // 準備中：未提出の提出物の期限が1週間以内
  var submDlNear=false;
  if(autoStat==='準備中'){
    var sDls=[];
    if(c['音源_要否']&&c['音源_要否']!=='不要'&&c['音源_状況']!=='提出済') sDls.push(c['音源_期限']);
    if(c['動画_要否']&&c['動画_要否']!=='不要'&&c['動画_状況']!=='提出済') sDls.push(c['動画_期限']);
    if(c['写真_要否']&&c['写真_要否']!=='不要'&&c['写真_状況']!=='提出済') sDls.push(c['写真_期限']);
    for(var si=0;si<sDls.length;si++){ if(isNearDeadline(sDls[si])){ submDlNear=true; break; } }
  }
  // エントリー予定：開始日カウントダウン
  var entryCd='';
  if(autoStat==='エントリー予定'&&c['エントリー_開始日']){
    var esD=new Date(c['エントリー_開始日']); var now0=new Date(); now0.setHours(0,0,0,0);
    var diffD=Math.ceil((esD-now0)/(86400000));
    if(diffD>0&&diffD<=7) entryCd='<span class="entry-cd">エントリー開始まであと'+diffD+'日</span>';
  }
  var warnSvg='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
  var dlBadge=(dlNear||submDlNear)?'<span class="dl-alert">'+warnSvg+' 期限1週間以内</span>':'';
  var extras=[]; if(dlBadge) extras.push(dlBadge); if(entryCd) extras.push(entryCd);
  var dlRow=extras.length?'<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">'+extras.join('')+'</div>':'';
  // Overdue: any deadline in the past
  var now1=new Date(); now1.setHours(0,0,0,0);
  var isOverdue=false;
  var odls=[c['エントリー_期限'],c['エントリー費_期限'],c['音源_期限'],c['動画_期限'],c['写真_期限'],c['観覧費_期限']];
  for(var oi=0;oi<odls.length;oi++){
    if(odls[oi]){ var od=new Date(odls[oi]); if(!isNaN(od)&&od<now1){ isOverdue=true; break; } }
  }
  var cls='cc'+(isUpcoming?' upcoming':'')+(isOverdue&&!isUpcoming?' overdue':'');
  return '<div class="'+cls+'" onclick="openView('+c._rowIndex+')">' +
    '<div class="cc-top"><span class="cc-name">'+esc(c['コンテスト名'])+fmtTag+'</span><span class="cc-badges"><span class="badge '+bc+'">'+esc(autoStat)+'</span>'+finalBadge+'</span></div>' +
    '<div class="cc-meta">'+meta+'</div>'+tc+dlRow+'</div>';
}

function doSave(){
  var data=collectForm(); data['_rowIndex']=S.editRow;
  var btn=document.getElementById('savebtn');
  var btnH=document.getElementById('savebtn-hdr');
  if(btn) btn.disabled=true;
  if(btnH) btnH.disabled=true;
  google.script.run
    .withSuccessHandler(function(r){
      if(btn) btn.disabled=false;
      if(btnH) btnH.disabled=false;
      if(r&&r.success){
        showToast('保存しました！');
        data['_rowIndex']=r.rowIndex;
        var idx=-1;
        for(var i=0;i<S.contests.length;i++){ if(S.contests[i]._rowIndex===r.rowIndex){ idx=i; break; } }
        if(idx>=0) S.contests[idx]=data; else S.contests.push(data);
        try { sessionStorage.setItem(CACHE_KEY, JSON.stringify(S.contests)); } catch(e) {}
        closeDet();
        renderContests(); renderProgress(); renderResults(); try{renderHome();}catch(e){}
      } else showToast('保存に失敗しました');
    })
    .withFailureHandler(function(e){
      if(btn) btn.disabled=false;
      if(btnH) btnH.disabled=false;
      showToast('エラー: '+esc(String(e)));
    })
    .saveContest(data);
}

function renderProgress() {
  var el=document.getElementById('pglist');
  var now=new Date(); now.setHours(0,0,0,0);
  var list=S.contests.filter(function(c){ var s=calcAutoStatus(c); return s!=='完了'&&s!=='キャンセル'; });

function getProgItems(c) {
  var items=[];
  // エントリー
  var eOk=c['エントリー_状況']==='提出済';
  items.push({label:'エントリー',status:c['エントリー_状況']||'未提出',ok:eOk,required:true});
  // 音源（事前提出のみ）
  if(c['音源_要否']==='事前'){
    var mOk=c['音源_状況']==='提出済';
    items.push({label:'音源',status:c['音源_状況']||'未着手',ok:mOk,deadline:c['音源_期限']});
  }
  // 動画（不要以外）
  if(c['動画_要否']&&c['動画_要否']!=='不要'){
    var vOk=c['動画_状況']==='提出済';
    items.push({label:'動画',status:c['動画_状況']||'未着手',ok:vOk,deadline:c['動画_期限']});
  }
  // 写真（不要以外）
  if(c['写真_要否']&&c['写真_要否']!=='不要'){
    var pOk=c['写真_状況']==='提出済';
    items.push({label:'写真',status:c['写真_状況']||'未着手',ok:pOk,deadline:c['写真_期限']});
  }
  // エントリー費（事前/振込の場合）
  var efMeth=c['エントリー費_支払方法']||'';
  if(efMeth==='事前'||efMeth==='振込'){
    var efOk=parseBool(c['エントリー費_振込済']);
    items.push({label:'エントリー費（'+efMeth+'）',status:efOk?'振込済':'未払',ok:efOk,required:true,deadline:c['エントリー費_期限']});
  }
  // 観覧費（事前支払いの場合）
  if(c['観覧費_支払方法']==='事前支払い'){
    var kOk=parseBool(c['観覧費_振込済']);
    items.push({label:'観覧費（事前）',status:kOk?'振込済':'未払',ok:kOk,required:true,deadline:c['観覧費_期限']});
  }
  return items;
}

function mkProgCard(c) {
  var items=getProgItems(c);
  var done=items.filter(function(i){ return i.ok; }).length;
  var pct=items.length?Math.round(done/items.length*100):100;
  var barColor=pct===100?'var(--OK)':(pct>=60?'var(--Y)':'var(--WN)');
  var pctColor=pct===100?'var(--OK-t)':(pct>=60?'var(--Y)':'var(--WN-t)');
  var bar='<div class="pg-bar-wrap">'+
    '<div class="pg-bar-header">'+
      '<span class="pg-bar-count">'+done+' / '+items.length+' 完了</span>'+
      '<span class="pg-bar-pct" style="color:'+pctColor+'">'+pct+'%</span>'+
    '</div>'+
    '<div class="pc-bw"><div class="pc-b" style="width:'+pct+'%;background:'+barColor+'"></div></div>'+
  '</div>';
  var ihtml='<div class="pg-items">'+items.map(function(item){
    var sc=item.ok?'s-ok':(item.required?'s-ng':'s-wn');
    var dc=item.ok?'var(--OK)':(item.required?'var(--NG)':'var(--WN)');
    var dl=item.deadline&&!item.ok?'<span class="pi-deadline"> '+fmtD(item.deadline)+'〆</span>':'';
    return '<div class="pi"><div class="pi-dot" style="background:'+dc+'"></div>'+
      '<span class="pi-label">'+esc(item.label)+dl+'</span>'+
      '<span class="pi-status '+sc+'">'+esc(item.status)+'</span></div>';
  }).join('')+'</div>';
  var cosNote=c['衣装_メモ']?'<div class="costume-note" style="margin-top:8px"><span class="cn-label">👗 衣装</span>'+esc(c['衣装_メモ'])+'</div>':'';
  return '<div class="pc" onclick="openProgStatus('+c._rowIndex+')">' +
    '<div class="pc-top"><div class="pc-name">'+esc(c['コンテスト名'])+'</div></div>'+
    '<div class="pc-date">'+(c['開催日']?fmtD(c['開催日']):'日程未定')+'</div>'+
    bar+ihtml+cosNote+'</div>';
}

  if(c['Instagram_URL']) html+='<div class="vr"><span class="vr-l">Instagram</span><span class="vr-v"><a href="'+esc(c['Instagram_URL'])+'" target="_blank" style="display:inline-flex;align-items:center;gap:5px;color:var(--LINK);text-decoration:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>開く ↗</a></span></div>';
  for(var ri=1;ri<=5;ri++){

  var IC_DB='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>';
  var IC_MON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>';
  var IC_TKT='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v2z"/></svg>';
  var tdayItems=[];
  var efMeth0=c['エントリー費_支払方法']||'';
  var efAmt0=parseInt(c['エントリー費_金額'])||0;
  if(efMeth0==='当日'&&efAmt0>0) {
    tdayItems.push({icon:IC_MON,name:'エントリー費（当日払い）',sub:'¥'+efAmt0.toLocaleString()+' × 3家族'});
  }
  if(c['音源_要否']==='当日CD') {
    var carriers=S.fams.filter(function(f){ return parseBool(c[f+'_音源_持参']); });
    var cdSub=carriers.length?carriers.join('・')+'が持参':'CDを持参';
    if(parseBool(c['音源_予備データ'])) cdSub+=' / 予備データ必要';
    tdayItems.push({icon:IC_CD,name:'CD',sub:cdSub});
  }
  if(c['音源_要否']==='事前') {
    if(parseBool(c['音源_当日CD'])) tdayItems.push({icon:IC_CD,name:'CD',sub:'事前提出済（念のためCD持参）'});
    if(parseBool(c['音源_予備データ'])) tdayItems.push({icon:IC_DB,name:'データ',sub:'事前提出済（念のためデータ持参）'});
  }
  var adultP0=parseInt(c['観覧費_大人_単価'])||0;
  var childP0=parseInt(c['観覧費_子供_単価'])||0;
  var kanranMeth=c['観覧費_支払方法']||'';
  var hasKanran=S.fams.some(function(f){ return (parseInt(c[f+'_観覧費_大人'])||0)+(parseInt(c[f+'_観覧費_子供'])||0)>0; });
  if(hasKanran&&(adultP0>0||childP0>0)&&kanranMeth==='当日支払い') {
    var kanSubs=[];
    S.fams.forEach(function(fam){
      var ad=parseInt(c[fam+'_観覧費_大人'])||0, ch=parseInt(c[fam+'_観覧費_子供'])||0;
      if(ad||ch){ var str=fam+':'; if(ad) str+=' 大人×'+ad; if(ch) str+=' 子供×'+ch; kanSubs.push(str); }
    });
    tdayItems.push({icon:IC_TKT,name:'観覧費',sub:kanSubs.join(' / ')});
  }
  if(tdayItems.length) {
    html+='<div class="tday-wrap"><div class="tday-title">当日の持ち物</div>';
    tdayItems.forEach(function(item){
      html+='<div class="tday-item"><div class="tday-icon">'+item.icon+'</div><div class="tday-body"><div class="tday-name">'+esc(item.name)+'</div><div class="tday-sub">'+esc(item.sub)+'</div></div></div>';
    });
    html+='</div>';

  // メモ
  var memos=[];
  if(c['衣装_メモ']) memos.push({l:'衣装',v:c['衣装_メモ']});
  if(c['問い合わせメモ']) memos.push({l:'問い合わせ',v:c['問い合わせメモ']});
  if(c['備考']) memos.push({l:'備考',v:c['備考']});

    html+='<div class="vs"><div class="vst">メモ</div>';
    memos.forEach(function(m){ html+='<div class="vr"><span class="vr-l">'+esc(m.l)+'</span><span class="vr-v" style="white-space:pre-wrap">'+esc(m.v)+'</span></div>'; });
    html+='</div>';
  }

  // ---- 進捗 ----
  var items=getProgItems(c);
  if(items.length) {
    var done=items.filter(function(i){return i.ok;}).length;
    var pct=Math.round(done/items.length*100);
    html+='<div class="vs"><div class="vst">進捗 '+done+'/'+items.length+' ('+pct+'%)</div>';
    items.forEach(function(item){
      var dc=item.ok?'var(--OK)':(item.required?'var(--NG)':'var(--WN)');
      var sc=item.ok?'s-ok':(item.required?'s-ng':'s-wn');
      var dl=item.deadline?'<span style="font-size:11px;color:var(--MU)"> '+fmtD(item.deadline)+'〆</span>':'';

      html+='<span class="vr-l" style="display:flex;align-items:center;gap:5px;min-width:0;flex:1">';
      html+='<span style="width:7px;height:7px;border-radius:50%;background:'+dc+';flex-shrink:0;display:inline-block"></span>';
      html+='<span style="word-break:break-all">'+esc(item.label)+dl+'</span></span>';
      html+='<span class="pi-status '+sc+'" style="flex-shrink:0;margin-left:6px">'+esc(item.status)+'</span>';
      html+='</div>';
    });
    html+='</div>';
  }

  return html;
}

function buildFinViewContent(c) {
  var efAmt=parseInt(c['エントリー費_金額'])||0;
  var efMeth=c['エントリー費_支払方法']||'事前';
  var efPer=efAmt;
  var adultP=parseInt(c['観覧費_大人_単価'])||0;
  var childP=parseInt(c['観覧費_子供_単価'])||0;
  var freeOne=parseBool(c['観覧費_付き添い無料']);
  var attending=S.fams.filter(function(f){ return parseInt(c[f+'_観覧費_大人'])>=1; });
  var gc=attending.length;
  var repShare=gc>0?Math.round((gc-(freeOne?1:0))*adultP/gc):0;
  var gAmt=parseInt(c['交通費_ガソリン代'])||0;
  var eAmt=parseInt(c['交通費_ETC'])||0;
  var tTotal=gAmt+eAmt;
  var tTargets=S.fams.filter(function(f){ return parseBool(c[f+'_交通費_対象']); });
  var transPerPerson=tTargets.length>0&&tTotal>0?Math.round(tTotal/tTargets.length):0;
  var html='';

  // 開催日
  if(c['開催日']) html+='<div style="font-size:13px;color:var(--MU);margin-bottom:12px">📅 '+fmtD(c['開催日'])+'</div>';

  // 費用設定サマリー
  var settings=[];
  if(efAmt>0) settings.push('エントリー費 ¥'+efAmt.toLocaleString()+'（'+efMeth+'・1人¥'+efPer.toLocaleString()+'）');
  if(adultP>0||childP>0) {
    var kStr='観覧費 大人¥'+adultP.toLocaleString()+(childP>0?' / 子供¥'+childP.toLocaleString():'')+(freeOne?' ・付添1名無料':'');
    settings.push(kStr);
  }
  if(tTotal>0) settings.push('交通費 ¥'+tTotal.toLocaleString()+(tTargets.length>0?' ÷'+tTargets.length+'人（1人¥'+transPerPerson.toLocaleString()+'）':''));
  if(settings.length) {
    html+='<div class="vs" style="margin-bottom:12px"><div class="vst">費用設定</div>';
    settings.forEach(function(s){ html+='<div class="vr"><span class="vr-v">'+esc(s)+'</span></div>'; });
    html+='</div>';
  }

  // 家族別内訳
  var hasAny=false;
  S.fams.forEach(function(fam){
    var parts=[];
    if(efAmt>0){ var ok=parseBool(c[fam+'_エントリー費_支払済']); parts.push({label:'エントリー費（'+efMeth+'）',amt:efPer,ok:ok,isDayOf:efMeth==='当日'}); }
    var ad=parseInt(c[fam+'_観覧費_大人'])||0, ch=parseInt(c[fam+'_観覧費_子供'])||0;
    if(ad>0||ch>0){
      var ok=parseBool(c[fam+'_観覧費_支払済']);
      var kanAmt=(ad>=1?repShare:0)+Math.max(ad-1,0)*adultP+ch*childP;
      var lbl='観覧費'+(ad>0?' 大人×'+ad:'')+(ch>0?' 子供×'+ch:'')+(freeOne&&ad>=1?'（付添無料）':'');
      parts.push({label:lbl,amt:kanAmt,ok:ok});
    }
    if(parseBool(c[fam+'_交通費_対象'])&&transPerPerson>0){ var ok=parseBool(c[fam+'_交通費_支払済']); parts.push({label:'交通費（÷'+tTargets.length+'人）',amt:transPerPerson,ok:ok}); }
    if(!parts.length) return;
    hasAny=true;
    var total=parts.reduce(function(s,p){ return s+p.amt; },0);
    var hasRealUnpaid=parts.some(function(p){ return !p.ok&&!p.isDayOf; });
    var hasDayOf=parts.some(function(p){ return p.isDayOf&&!p.ok; });
    var blockCls=hasRealUnpaid?'has-unpaid':'all-paid';
    var badgeCls=hasRealUnpaid?'unpaid':(hasDayOf?'dayof':'paid');
    var badgeTxt=hasRealUnpaid?'未払あり':(hasDayOf?'当日払い':'支払済');
    html+='<div class="fam-fin-block '+blockCls+'" style="margin-bottom:8px">';
    html+='<div class="ffb-head"><span class="ffb-name">'+esc(fam)+'</span><span class="ffb-badge '+badgeCls+'">'+badgeTxt+'</span></div>';
    parts.forEach(function(p){
      var rowCls=(!p.ok&&!p.isDayOf)?' unpaid':'';
      html+='<div class="fc-row'+rowCls+'">'+
        '<span class="fc-row-label">'+esc(p.label)+'</span>'+
        '<span class="fc-row-val">'+(p.ok?'<svg class="chk-ic ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>':'<svg class="chk-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>')+' ¥'+p.amt.toLocaleString()+'</span></div>';
    });
    html+='<div class="ffb-total">合計 ¥'+total.toLocaleString()+'</div></div>';
  });
  if(!hasAny) html+='<div style="font-size:13px;color:var(--MU);text-align:center;padding:20px 0">金額未入力 — 編集から入力してください</div>';
  return html;
}


function buildFinCollectSection(c) {
  var efAmt=parseInt(c['エントリー費_金額'])||0;
  var efMeth=c['エントリー費_支払方法']||'';
  var adultP=parseInt(c['観覧費_大人_単価'])||0;
  var childP=parseInt(c['観覧費_子供_単価'])||0;
  var freeOne=parseBool(c['観覧費_付き添い無料']);
  var attending=S.fams.filter(function(f){ return parseInt(c[f+'_観覧費_大人'])>=1; });
  var gc=attending.length;
  var repShare=gc>0?Math.round(Math.max(gc-(freeOne?1:0),0)*adultP/gc):0;
  var gAmt=parseInt(c['交通費_ガソリン代'])||0;
  var eAmt=parseInt(c['交通費_ETC'])||0;
  var tTotal=gAmt+eAmt;
  var tTargets=S.fams.filter(function(f){ return parseBool(c[f+'_交通費_対象']); });
  var transPerPerson=tTargets.length>0&&tTotal>0?Math.round(tTotal/tTargets.length):0;
  var otherAmt=parseInt(c['その他_金額'])||0;
  var otherTargets=S.fams.filter(function(f){ return parseBool(c[f+'_その他_対象']); });
  var otherPer=otherTargets.length>0&&otherAmt>0?Math.round(otherAmt/otherTargets.length):0;
  var kanFree=(c['観覧費_支払方法']==='不要');

  var html='';
  var hasAny=false;
  S.fams.forEach(function(fam){
    var items=[];
    if(efAmt>0){
      var efOk=parseBool(c[fam+'_エントリー費_支払済']);
      items.push({label:'エントリー費（'+esc(efMeth||'事前')+'）',amt:efAmt,ok:efOk,field:fam+'_エントリー費_支払済'});
    }
    var ad=parseInt(c[fam+'_観覧費_大人'])||0;
    var ch=parseInt(c[fam+'_観覧費_子供'])||0;
    if(!kanFree&&(ad>0||ch>0)){
      var kanOk=parseBool(c[fam+'_観覧費_支払済']);
      var excess=Math.max(ad-1,0);
      var kanAmt=(ad>=1?repShare:0)+excess*adultP+ch*childP;
      var kanLbl='観覧費';
      if(ad>0) kanLbl+=' 大人×'+ad;
      if(ch>0) kanLbl+=' 子供×'+ch;
      if(freeOne&&ad>=1) kanLbl+='（付添無料適用）';
      items.push({label:kanLbl,amt:kanAmt,ok:kanOk,field:fam+'_観覧費_支払済'});
    }
    if(parseBool(c[fam+'_交通費_対象'])&&transPerPerson>0){
      var transOk=parseBool(c[fam+'_交通費_支払済']);
      items.push({label:'交通費（÷'+tTargets.length+'人）',amt:transPerPerson,ok:transOk,field:fam+'_交通費_支払済'});
    }
    if(parseBool(c[fam+'_その他_対象'])&&otherPer>0){
      var otherOk=parseBool(c[fam+'_その他_集金済']);
      var otherLbl=(c['その他_用途']?esc(c['その他_用途']):'その他')+'（÷'+otherTargets.length+'人）';
      items.push({label:otherLbl,amt:otherPer,ok:otherOk,field:fam+'_その他_集金済'});
    }
    if(items.length===0) return;
    hasAny=true;
    var famUnpaid=items.some(function(i){ return !i.ok; });
    var total=items.reduce(function(s,i){ return s+i.amt; },0);
    var fBlockCls=famUnpaid?'has-unpaid':'all-paid';
    var fBadgeCls=famUnpaid?'unpaid':'paid';
    var fBadgeTxt=famUnpaid?'未集金':'集金済';
    html+='<div class="fam-fin-block '+fBlockCls+'">';
    html+='<div class="ffb-head"><span class="ffb-name">'+esc(fam)+'</span>'+
      '<span class="ffb-badge '+fBadgeCls+'">'+fBadgeTxt+'</span></div>';
    items.forEach(function(item){
      var iRowCls=!item.ok?' unpaid':'';
      var chkSvg=item.ok?'<svg class="chk-ic ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><polyline points="7 12 10.5 15.5 17 8.5"/></svg>':'<svg class="chk-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/></svg>';
      html+='<div class="fc-row'+iRowCls+'">'+
        '<span class="fc-row-label">'+esc(item.label)+'</span>'+
        '<span class="fc-row-val">'+
          '<button class="chk-btn" onclick="togglePaid('+c._rowIndex+',\''+item.field+'\')">'+chkSvg+'</button>'+
          '¥'+item.amt.toLocaleString()+
        '</span></div>';
    });
    html+='<div class="ffb-total">合計 ¥'+total.toLocaleString()+'</div>';
    html+='</div>';
  });
  return hasAny?html:'';
}

function openProgStatus(row) {
  var c=S.contests.filter(function(x){ return x._rowIndex===row; })[0];
  if(!c) return;
  S.progRow=row;
  document.getElementById('psh-title').textContent=c['コンテスト名']||'';
  document.getElementById('psh-date').textContent=c['開催日']?fmtD(c['開催日']):'';
  document.getElementById('psh-body').innerHTML=buildProgForm(c);
  document.getElementById('progov').classList.add('on');
}
function closeProgStatus(){ document.getElementById('progov').classList.remove('on'); }

var CHK_STYLE=' style="width:22px;height:22px;accent-color:var(--Y);transition:transform .12s"';
function mkProgChk(id, checked, field, valTrue, valFalse) {
  return '<input type="checkbox" id="'+id+'"'+(checked?' checked':'')+CHK_STYLE+' onchange="autoProgChk(this,\''+field+'\',\''+valTrue+'\',\''+valFalse+'\')">';
}
function buildProgForm(c) {
  var html='<div style="font-size:12px;color:var(--MU);margin-bottom:12px;text-align:center">チェックすると即座に保存されます</div>';
  // エントリー
  html+='<div class="ps-card"><div class="ps-label">エントリー</div>';
  html+='<div class="ps-chk-row"><span style="font-size:14px">提出済</span>';
  html+=mkProgChk('ps-entry-done',c['エントリー_状況']==='提出済','エントリー_状況','提出済','未提出');
  html+='</div></div>';
  // 音源（事前提出のみ）
  if(c['音源_要否']==='事前'){
    html+='<div class="ps-card"><div class="ps-label">音源'+( c['音源_期限']?'<span style="font-size:11px;color:var(--MU);font-weight:400;margin-left:6px">〆'+fmtD(c['音源_期限'])+'</span>':'')+'</div>';
    html+='<div class="ps-chk-row"><span style="font-size:14px">提出済</span>';
    html+=mkProgChk('ps-music-done',c['音源_状況']==='提出済','音源_状況','提出済','未着手');
    html+='</div></div>';
  }
  // 動画（不要以外）
  if(c['動画_要否']&&c['動画_要否']!=='不要'){
    html+='<div class="ps-card"><div class="ps-label">動画'+( c['動画_期限']?'<span style="font-size:11px;color:var(--MU);font-weight:400;margin-left:6px">〆'+fmtD(c['動画_期限'])+'</span>':'')+'</div>';
    html+='<div class="ps-chk-row"><span style="font-size:14px">提出済</span>';
    html+=mkProgChk('ps-video-done',c['動画_状況']==='提出済','動画_状況','提出済','未着手');
    html+='</div></div>';
  }
  // 写真（不要以外）
  if(c['写真_要否']&&c['写真_要否']!=='不要'){
    html+='<div class="ps-card"><div class="ps-label">写真'+( c['写真_期限']?'<span style="font-size:11px;color:var(--MU);font-weight:400;margin-left:6px">〆'+fmtD(c['写真_期限'])+'</span>':'')+'</div>';
    html+='<div class="ps-chk-row"><span style="font-size:14px">提出済</span>';
    html+=mkProgChk('ps-photo-done',c['写真_状況']==='提出済','写真_状況','提出済','未着手');
    html+='</div></div>';
  }
  // エントリー費（事前/振込）
  var efMeth=c['エントリー費_支払方法']||'';

    html+='<div class="ps-chk-row"><span style="font-size:14px">振込済</span>';

var _progSaveTimer=null;
function autoProgChk(el, field, valTrue, valFalse) {
  var row=S.progRow;
  var idx=-1;
  for(var i=0;i<S.contests.length;i++){ if(S.contests[i]._rowIndex===row){ idx=i; break; } }
  if(idx<0) return;
  // Parse value
  var newVal=el.checked ? (valTrue==='true'?true:(valTrue==='false'?false:valTrue)) : (valFalse==='true'?true:(valFalse==='false'?false:valFalse));
  S.contests[idx][field]=newVal;
  // Show saving indicator
  var foot=document.getElementById('psh-foot');
  if(foot){ foot.style.display='block'; }
  // Debounce to batch rapid changes
  if(_progSaveTimer) clearTimeout(_progSaveTimer);
  _progSaveTimer=setTimeout(function(){
    var c=S.contests[idx];
    var data={};
    Object.keys(c).forEach(function(k){ data[k]=c[k]; });
    data['_rowIndex']=row;
    renderContests(); renderProgress(); renderFinance();
    google.script.run
      .withSuccessHandler(function(r){
        if(foot) foot.style.display='none';
        if(r&&r.success){
          data['_rowIndex']=r.rowIndex;
          S.contests[idx]=data;
          try { sessionStorage.setItem(CACHE_KEY, JSON.stringify(S.contests)); } catch(e) {}
          renderContests(); renderProgress(); renderFinance();
        } else showToast('保存失敗');
      })
      .withFailureHandler(function(e){
        if(foot) foot.style.display='none';
        showToast('エラー: '+esc(String(e)));
      })
      .saveContest(data);
  }, 600);
}

function calcFamUnpaid(c, fam) {
  var efAmt=parseInt(c['エントリー費_金額'])||0;
  var adultP=parseInt(c['観覧費_大人_単価'])||0, childP=parseInt(c['観覧費_子供_単価'])||0;
  var freeOne=parseBool(c['観覧費_付き添い無料']);
  var attending=S.fams.filter(function(f){ return parseInt(c[f+'_観覧費_大人'])>=1; });
  var gc=attending.length;
  var repShare=gc>0?Math.round(Math.max(gc-(freeOne?1:0),0)*adultP/gc):0;
  var tTotal=(parseInt(c['交通費_ガソリン代'])||0)+(parseInt(c['交通費_ETC'])||0);
  var tTargets=S.fams.filter(function(f){ return parseBool(c[f+'_交通費_対象']); });
  var transPerPerson=tTargets.length>0&&tTotal>0?Math.round(tTotal/tTargets.length):0;
  var kanFree=(c['観覧費_支払方法']==='不要');
  var amt=0;
  if(efAmt>0&&!parseBool(c[fam+'_エントリー費_支払済'])) amt+=efAmt;
  var ad=parseInt(c[fam+'_観覧費_大人'])||0, ch=parseInt(c[fam+'_観覧費_子供'])||0;
  if(!kanFree&&(ad>0||ch>0)&&!parseBool(c[fam+'_観覧費_支払済'])) amt+=(ad>=1?repShare:0)+Math.max(ad-1,0)*adultP+ch*childP;
  if(parseBool(c[fam+'_交通費_対象'])&&transPerPerson>0&&!parseBool(c[fam+'_交通費_支払済'])) amt+=transPerPerson;
  var otherAmt=parseInt(c['その他_金額'])||0;
  var otherTargets=S.fams.filter(function(f){ return parseBool(c[f+'_その他_対象']); });
  var otherPer=otherTargets.length>0&&otherAmt>0?Math.round(otherAmt/otherTargets.length):0;
  if(parseBool(c[fam+'_その他_対象'])&&otherPer>0&&!parseBool(c[fam+'_その他_集金済'])) amt+=otherPer;
  return amt;
}

function calcFamTotal(c, fam) {
  // Total amount owed (paid or unpaid)
  var efAmt=parseInt(c['エントリー費_金額'])||0;
  var adultP=parseInt(c['観覧費_大人_単価'])||0, childP=parseInt(c['観覧費_子供_単価'])||0;
  var freeOne=parseBool(c['観覧費_付き添い無料']);
  var attending=S.fams.filter(function(f){ return parseInt(c[f+'_観覧費_大人'])>=1; });
  var repShare=freeOne&&attending.length>0?0:adultP;
  var kanFree=(c['観覧費_支払方法']==='不要');
  var tTotal=(parseInt(c['交通費_ガソリン代'])||0)+(parseInt(c['交通費_ETC'])||0);
  var tTargets=S.fams.filter(function(f){ return parseBool(c[f+'_交通費_対象']); });
  var transPerPerson=tTargets.length>0&&tTotal>0?Math.round(tTotal/tTargets.length):0;
  var otherAmt=parseInt(c['その他_金額'])||0;
  var otherTargets=S.fams.filter(function(f){ return parseBool(c[f+'_その他_対象']); });
  var otherPer=otherTargets.length>0&&otherAmt>0?Math.round(otherAmt/otherTargets.length):0;
  var amt=0;
  if(efAmt>0) amt+=efAmt;
  var ad=parseInt(c[fam+'_観覧費_大人'])||0, ch=parseInt(c[fam+'_観覧費_子供'])||0;
  if(!kanFree&&(ad>0||ch>0)) amt+=(ad>=1?repShare:0)+Math.max(ad-1,0)*adultP+ch*childP;
  if(parseBool(c[fam+'_交通費_対象'])&&transPerPerson>0) amt+=transPerPerson;
  if(parseBool(c[fam+'_その他_対象'])&&otherPer>0) amt+=otherPer;
  return amt;
}
function buildFinanceSummary() {
  var list=S.contests.filter(function(c){ return calcAutoStatus(c)!=='キャンセル'; });
  var unpaidTotals={}, grandTotals={};
  S.fams.forEach(function(fam){ unpaidTotals[fam]=0; grandTotals[fam]=0; });
  list.forEach(function(c){
    S.fams.forEach(function(fam){
      unpaidTotals[fam]+=calcFamUnpaid(c,fam);
      grandTotals[fam]+=calcFamTotal(c,fam);
    });
  });
  var html='<div style="background:var(--SFC);border-radius:var(--R);padding:14px 16px;margin-bottom:12px;box-shadow:var(--SH);border:0.5px solid var(--BD)">';
  html+='<div style="font-size:11px;font-weight:600;color:var(--MU);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px">集金状況まとめ</div>';
  html+='<div style="display:flex;gap:8px">';
  S.fams.forEach(function(fam){
    var unpaid=unpaidTotals[fam], total=grandTotals[fam];
    var has=unpaid>0;
    html+='<div style="flex:1;background:'+(has?'var(--NG-bg)':'var(--OK-bg)')+';border-radius:var(--RS);padding:10px 8px;text-align:center;border:0.5px solid '+(has?'rgba(255,59,48,.2)':'rgba(52,199,89,.2)')+'">';
    html+='<div style="font-size:11px;font-weight:600;color:var(--MU);margin-bottom:3px">'+esc(fam)+'</div>';
    if(has){
      html+='<div style="font-size:14px;font-weight:700;color:var(--NG-t)">¥'+unpaid.toLocaleString()+'</div>';
      html+='<div style="font-size:10px;color:var(--NG-t);font-weight:500;margin-top:1px">未払い</div>';
    } else {
      html+='<div style="font-size:14px;font-weight:700;color:var(--OK-t)">¥'+total.toLocaleString()+'</div>';
      html+='<div style="font-size:10px;color:var(--OK-t);font-weight:500;margin-top:1px">集金済</div>';
    }
    html+='</div>';
  });
  html+='</div>';
  // Year total
  var yearTotal=S.fams.reduce(function(s,fam){ return s+grandTotals[fam]; },0);
  if(yearTotal>0){
    html+='<div style="margin-top:10px;padding-top:8px;border-top:0.5px solid var(--BD);font-size:12px;color:var(--MU);text-align:right">年間合計 <span style="font-weight:700;color:var(--TX);font-size:14px">¥'+yearTotal.toLocaleString()+'</span></div>';
  }
  html+='</div>';
  return html;
}

function contestHasUnpaid(c) {

function renderFinance() {
  var el=document.getElementById('finlist');

// ============================================================
// Utils
// ============================================================
function parseBool(v){
  if(v===true||v===false) return v;
  if(v===null||v===undefined||v==='') return false;
  if(typeof v==='number') return v===1;
  var s=String(v).replace(/^\s+|\s+$/g,'').toUpperCase();
  if(!s) return false;
  return s==='TRUE'||s==='1';
}
function isNearDeadline(dateStr){
  if(!dateStr) return false;
  var d=new Date(dateStr); if(isNaN(d.getTime())) return false;
  var now=new Date(); now.setHours(0,0,0,0);
  var diff=d-now;
  return diff>=0&&diff<=7*24*60*60*1000;
}
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtD(s){
  if(!s) return '';
  var d=new Date(s); if(isNaN(d.getTime())) return s;
  var dw=['日','月','火','水','木','金','土'];
  return (d.getMonth()+1)+'月'+d.getDate()+'日('+dw[d.getDay()]+')';
}

// ============================================================
// プルトゥリフレッシュ
// ============================================================
(function(){
  var startY=0, curY=0, active=false, triggered=false;
  var threshold=130;
  var ind=null;

  function getInd(){
    if(ind) return ind;
    ind=document.createElement('div');
    ind.id='ptr-wrap';
    ind.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;pointer-events:none;overflow:hidden;height:0;transition:height .2s ease;';
    var isDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
    ind.innerHTML='<div id="ptr-inner" style="height:64px;display:flex;align-items:center;justify-content:center;gap:12px;background:'+(isDark?'#1C1C1E':'#FFFFFF')+';border-radius:0 0 20px 20px;box-shadow:0 4px 20px rgba(0,0,0,0.10);transform:translateY(-64px);transition:transform .2s ease"><div id="ptr-gem" style="width:20px;height:20px;background:#C8A200;border-radius:50%"></div><div id="ptr-txt" style="font-size:13px;font-weight:600;color:#8E8E93">引っ張って更新</div></div>';
    document.body.appendChild(ind);
    return ind;
  }

  function setProgress(dist){
    var el=getInd();
    var ratio=Math.min(dist/threshold,1);
    var h=Math.round(ratio*64);
    el.style.height=h+'px';
    el.querySelector('#ptr-inner').style.transform='translateY('+(h-64)+'px)';
    if(dist>threshold){
      el.querySelector('#ptr-gem').style.transform='rotate(180deg)';
      el.querySelector('#ptr-txt').textContent='離して更新';
    } else {
      el.querySelector('#ptr-gem').style.transform='rotate(0deg)';
      el.querySelector('#ptr-txt').textContent='引っ張って更新';
    }
  }

  function doRefresh(){
    var el=getInd();
    el.style.height='64px';
    el.querySelector('#ptr-inner').style.transform='translateY(0)';
    el.querySelector('#ptr-gem').textContent='';
    el.querySelector('#ptr-gem').style.animation='ptr-spin 0.7s linear infinite';
    el.querySelector('#ptr-txt').textContent='更新中...';
    var st=document.createElement('style');
    st.textContent='@keyframes ptr-spin{to{transform:rotate(360deg)}}';
    document.head.appendChild(st);
    setTimeout(function(){
      loadAll();
      setTimeout(function(){ reset(); ind=null; },800);
    },500);
  }

  function reset(){
    if(!ind) return;
    ind.style.transition='height .25s ease';
    ind.querySelector('#ptr-inner').style.transition='transform .25s ease';
    ind.style.height='0';
    ind.querySelector('#ptr-inner').style.transform='translateY(-64px)';
  }

  function getScrollTop(){
    var list=document.getElementById('list');
    if(list) return list.scrollTop;
    return window.pageYOffset||document.documentElement.scrollTop||0;
  }

  document.addEventListener('touchstart',function(e){
    if(getScrollTop()===0){
      startY=e.touches[0].clientY;
      active=true; triggered=false;
    }
  },{passive:true});

  document.addEventListener('touchmove',function(e){
    if(!active) return;
    curY=e.touches[0].clientY;
    var dist=curY-startY;
    if(dist>0 && getScrollTop()===0){
      setProgress(dist);
    }
  },{passive:true});

  document.addEventListener('touchend',function(){
    if(!active) return;
    active=false;
    var dist=curY-startY;
    if(dist>threshold && getScrollTop()===0 && !triggered){
      triggered=true;
      doRefresh();
    } else {
      reset();
    }
  },{passive:true});
})();

function isETCDay(dateStr) {
  if(!dateStr) return false;
  var d=new Date(dateStr);
  if(isNaN(d)) return false;
  var day=d.getDay();
  return day===0||day===6||!!JP_HOLIDAYS[dateStr];
}

function calcTripCost(r) {
  var roundTrip=parseBool(r['往復']);
  var highwayRaw=parseFloat(r['高速料金'])||0;
  if(roundTrip) highwayRaw*=2;
  var etcOn=parseBool(r['ETC割引']);
  var highway=etcOn?Math.floor(highwayRaw*0.7):highwayRaw;
  var gasPerL=parseFloat(r['ガソリン単価'])||0;
  var dist=parseFloat(r['走行距離'])||0;
  if(roundTrip) dist*=2;
  var fe=parseFloat(r['燃費'])||15;
  var gas=(gasPerL>0&&dist>0&&fe>0)?Math.floor(gasPerL*dist/fe):0;
  var hasP=parseBool(r['駐車場有無']);
  var parking=hasP?(parseInt(r['駐車場料金'])||0):0;
  var others=[];
  try{ var raw=r['その他費用JSON']; if(raw&&raw!=='') others=JSON.parse(raw); }catch(e){}
  if(!Array.isArray(others)) others=[];
  var total=gas+highway+parking;
  others.forEach(function(o){ total+=parseInt(o.amount)||0; });
  return {gas:gas,highway:highway,parking:parking,others:others,total:total};
}

function calcProjectSettlement(records) {
  var fams=['Rinka','Airi','Miha'];
  var paid={Rinka:0,Airi:0,Miha:0};
  var owed={Rinka:0,Airi:0,Miha:0};
  records.forEach(function(r){
    var costs=calcTripCost(r);
    var payer=r['支払者'];
    var passengers=(r['乗車メンバー']||'').split(',').map(function(s){return s.trim();}).filter(function(s){return s;});
    var sharedTotal=costs.gas+costs.highway+costs.parking;
    if(payer&&paid[payer]!==undefined) paid[payer]+=sharedTotal;
    costs.others.forEach(function(o){
      if(payer&&paid[payer]!==undefined) paid[payer]+=parseInt(o.amount)||0;
    });
    if(passengers.length>0){
      var perP=Math.floor(sharedTotal/passengers.length);
      passengers.forEach(function(p){ if(owed[p]!==undefined) owed[p]+=perP; });
    }
    costs.others.forEach(function(o){
      var tgts=Array.isArray(o.targets)?o.targets.filter(function(t){return t;}):[];
      if(tgts.length>0){
        var pp=Math.floor((parseInt(o.amount)||0)/tgts.length);
        tgts.forEach(function(t){ if(owed[t]!==undefined) owed[t]+=pp; });
      }
    });
  });
  var net={};
  fams.forEach(function(f){ net[f]=paid[f]-owed[f]; });
  var creditors=fams.filter(function(f){return net[f]>0;}).map(function(f){return {name:f,amt:net[f]};}).sort(function(a,b){return b.amt-a.amt;});
  var debtors=fams.filter(function(f){return net[f]<0;}).map(function(f){return {name:f,amt:-net[f]};}).sort(function(a,b){return b.amt-a.amt;});
  var transfers=[];
  var ci=0,di=0;
  while(ci<creditors.length&&di<debtors.length){
    var amt=Math.floor(Math.min(creditors[ci].amt,debtors[di].amt));
    if(amt>0) transfers.push({from:debtors[di].name,to:creditors[ci].name,amount:amt});
    creditors[ci].amt-=amt; debtors[di].amt-=amt;
    if(creditors[ci].amt<1) ci++;
    if(debtors[di].amt<1) di++;
  }
  return {paid:paid,owed:owed,net:net,transfers:transfers};
}

function loadTripData() {
  var el=document.getElementById('tripslist');
  if(el) el.innerHTML='<div class="loading"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
  var done=false;
  function showTripLoadError(message, detail, isTimeout) {
    console.error(message, detail);
    var el=document.getElementById('tripslist');
    if(!el) return;
    var body=isTimeout
      ? '<p style="margin-bottom:12px">読み込みがタイムアウトしました</p>'
      : '<p style="margin-bottom:12px">読み込み失敗:<br><span style="font-size:12px;color:var(--MU)">'+esc(String(detail))+'</span></p>';
    el.innerHTML=body?'<div class="empty">'+body+'<button onclick="S.tripProjects=null;switchFinTab(\'trips\')" style="padding:10px 20px;border-radius:999px;background:var(--Y);color:#fff;font-size:14px;font-weight:700;border:none">再読み込み</button></div>':'';
  }
  var timer=setTimeout(function(){
    if(done) return;
    done=true;
    showTripLoadError('Trip data load timed out', new Error('Trip data load timed out'), true);
  }, 20000);
  google.script.run
    .withSuccessHandler(function(data){
      if(done) return;
      done=true; clearTimeout(timer);
      console.log('[TRIP DEBUG] data received:', JSON.stringify(data));
      if(data&&data.debugError) console.error('[TRIP ERROR from server]', data.debugError);
      try{
        data=data||{};
        S.tripProjects=Array.isArray(data.projects)?data.projects:[];
        S.tripRecords=(data.recordsByProject&&typeof data.recordsByProject==='object')?data.recordsByProject:{};
        S.carSettings=Array.isArray(data.carSettings)?data.carSettings:(Array.isArray(data.carConfigs)?data.carConfigs:[]);
        renderTrips();
      }catch(e){
        showTripLoadError('Trip data render failed', e, false);
      }
    })
    .withFailureHandler(function(e){
      if(done) return;
      done=true; clearTimeout(timer);
      showTripLoadError('Trip data load failed', e, false);
    })
    .getAllTripData();
}

  var recs=(S.tripRecords&&S.tripRecords[S.activeProj['ID']])||[];
  var rec=null;
  for(var i=0;i<recs.length;i++){if(recs[i]['ID']===recId){rec=recs[i];break;}}
  if(!rec) return;
  S.editRecordData=rec;
  document.getElementById('trtitle').textContent='記録を編集';
  document.getElementById('trh-del-btn').style.display='flex';
  _otherExpCount=0;
  buildRecordForm(rec);
  document.getElementById('triprecov').classList.add('on');
}
function closeTripRecord() {
  document.getElementById('triprecov').classList.remove('on');
}

function getFuelEff(driverName) {
  if(!S.carSettings||!S.carSettings.length) return 15;
  for(var i=0;i<S.carSettings.length;i++){
    var nm=String(S.carSettings[i]['名前']||'');
    if(nm.indexOf(driverName)>=0){
      var fe=parseFloat(S.carSettings[i]['燃費']);
      return isNaN(fe)?15:fe;
    }
  }
  return 15;
}

function buildRecordForm(r) {
  var fams=S.fams;
  var today=new Date(); var todayStr=today.getFullYear()+'-'+('0'+(today.getMonth()+1)).slice(-2)+'-'+('0'+today.getDate()).slice(-2);
  var dateVal=r?r['日付']:todayStr;
  var purpose=r?r['目的']:'';
  var dest=r?r['目的地']:'';
  var driver=r?(r['運転者']||r['支払者']):'';
  var passArr=(r&&r['乗車メンバー'])?(r['乗車メンバー'].split(',').map(function(s){return s.trim();})):[];
  // Parse IC fields from stored "A→B" format
  var highwaySec=r?r['高速区間']:'';
  var hwFrom='', hwTo='';
  if(highwaySec&&highwaySec.indexOf('→')>=0){
    var hwParts=highwaySec.split('→'); hwFrom=hwParts[0].trim(); hwTo=hwParts.slice(1).join('→').trim();
  } else if(highwaySec){ hwFrom=highwaySec; }
  var highwayAmt=r?(parseInt(r['高速料金'])||0):'';
  var etcOn=r?parseBool(r['ETC割引']):isETCDay(dateVal);
  var roundTrip=r?parseBool(r['往復']):true;
  var gasPerL=r?(parseFloat(r['ガソリン単価'])||''):'';
  var dist=r?(parseFloat(r['走行距離'])||''):'';
  var fe=r?(parseFloat(r['燃費'])||getFuelEff(driver)):getFuelEff(driver);
  var hasParking=r?parseBool(r['駐車場有無']):false;
  var parkingAmt=r?(parseInt(r['駐車場料金'])||''):'';
  var others=[];
  if(r&&r['その他費用JSON']){ try{others=JSON.parse(r['その他費用JSON']);}catch(e){} }
  if(!Array.isArray(others)) others=[];

  var html='';
  // Date + purpose + dest
  html+='<div class="fs"><div class="fst">基本情報</div>';
  html+='<div class="fg"><label class="fl">日付</label><input type="date" id="tr-date" class="fi" value="'+esc(dateVal)+'" onchange="onTRDateChange(this.value)"></div>';
  html+='<div class="fg"><label class="fl">目的</label><input type="text" id="tr-purpose" class="fi" value="'+esc(purpose)+'" placeholder="例: NUMBER練習"></div>';
  html+='<div class="fg"><label class="fl">目的地</label><input type="text" id="tr-dest" class="fi" value="'+esc(dest)+'" placeholder="例: 〇〇ダンススタジオ"></div>';
  html+='</div>';

  // Driver（＝支払者） + passengers
  html+='<div class="fs"><div class="fst">メンバー</div>';
  html+='<div class="fg" style="margin-bottom:12px"><label class="fl">運転者（支払者）</label><select id="tr-driver" class="fsl" onchange="onTRDriverChange(this.value)"><option value="">選択</option>';
  fams.forEach(function(f){ html+='<option value="'+esc(f)+'"'+(driver===f?' selected':'')+'>'+esc(f)+'</option>'; });
  html+='</select></div>';
  html+='<div class="fg"><label class="fl">乗車メンバー（複数選択可）</label>';
  html+='<div class="member-toggle-wrap" id="tr-passengers">';
  fams.forEach(function(f){
    var on=passArr.indexOf(f)>=0;
    html+='<button type="button" class="mtog'+(on?' on':'')+'" onclick="togglePassenger(this,\''+esc(f)+'\')">'+esc(f)+'</button>';
  });
  html+='</div></div>';
  html+='</div>';

  // Highway
  html+='<div class="fs"><div class="fst">高速道路</div>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px">';
  html+='<div class="fg" style="margin-bottom:0"><label class="fl">出発IC</label><input type="text" id="tr-hw-from" class="fi" value="'+esc(hwFrom)+'" placeholder="例: 桑名"></div>';
  html+='<div class="fg" style="margin-bottom:0"><label class="fl">到着IC</label><input type="text" id="tr-hw-to" class="fi" value="'+esc(hwTo)+'" placeholder="例: 名古屋西"></div>';
  html+='</div>';
  html+='<button type="button" onclick="window.open(\'https://dc.c-nexco.co.jp/dc/DriveCompass.html#stt_iptTtl\',\'_blank\')" style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--Y);background:none;border:none;cursor:pointer;padding:0;margin-bottom:10px">';
  html+='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>NEXCO料金検索で確認する</button>';
  html+='<div class="fg" style="margin-bottom:8px"><label class="fl">片道料金（円）</label><input type="number" id="tr-hw-amt" class="fi" value="'+esc(String(highwayAmt))+'" placeholder="0" min="0" oninput="updateGasCalc()"></div>';
  html+='<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:4px 0">';
  html+='<input type="checkbox" id="tr-etc" style="width:20px;height:20px;accent-color:var(--Y)"'+(etcOn?' checked':'')+' onchange="updateGasCalc()"> ETC割引（土日祝30%オフ）自動判定';
  html+='</label>';
  html+='</div>';

  // Gas
  html+='<div class="fs"><div class="fst">ガソリン代</div>';
  html+='<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:4px 0;margin-bottom:10px">';
  html+='<input type="checkbox" id="tr-roundtrip" style="width:20px;height:20px;accent-color:var(--Y)"'+(roundTrip?' checked':'')+' onchange="updateGasCalc()"> 往復（距離・高速料金を2倍で計算）';
  html+='</label>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:8px">';
  html+='<div class="fg" style="margin-bottom:0"><label class="fl">単価（円/L）</label><input type="number" id="tr-gas-price" class="fi" value="'+esc(String(gasPerL))+'" placeholder="例: 168" min="0" step="0.1" oninput="updateGasCalc()"></div>';
  html+='<div class="fg" style="margin-bottom:0"><label class="fl">片道距離（km）</label><input type="number" id="tr-distance" class="fi" value="'+esc(String(dist))+'" placeholder="例: 60" min="0" step="0.1" oninput="updateGasCalc()"></div>';
  html+='<div class="fg" style="margin-bottom:0"><label class="fl">燃費（km/L）</label><input type="number" id="tr-fuel-eff" class="fi" value="'+esc(String(fe))+'" placeholder="15" min="1" step="0.1" oninput="updateGasCalc()"></div>';
  html+='</div>';
  html+='<div id="gas-calc-display" class="gas-calc-display" style="display:none"></div>';
  html+='</div>';

  // Parking
  html+='<div class="fs"><div class="fst">駐車場</div>';
  html+='<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:4px 0;margin-bottom:8px">';
  html+='<input type="checkbox" id="tr-parking-chk" style="width:20px;height:20px;accent-color:var(--Y)"'+(hasParking?' checked':'')+' onchange="toggleParkingInput()"> 駐車場利用';
  html+='</label>';
  html+='<div id="tr-parking-wrap" style="display:'+(hasParking?'block':'none')+'">';
  html+='<div class="fg"><label class="fl">駐車場代（円）</label><input type="number" id="tr-parking-amt" class="fi" value="'+esc(String(parkingAmt))+'" placeholder="0" min="0"></div>';
  html+='</div></div>';

  // Other expenses
  html+='<div class="fs"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><span class="fst" style="margin-bottom:0">その他費用</span>';
  html+='<button type="button" style="font-size:12px;font-weight:700;color:var(--Y);display:flex;align-items:center;gap:3px;padding:4px 8px;border-radius:999px;background:var(--YBG)" onclick="addOtherExp()">+ 追加</button></div>';
  html+='<div id="other-exp-list">';
  others.forEach(function(o,i){ html+=buildOtherExpRow(i,o.label||'',parseInt(o.amount)||0,o.targets||[]); _otherExpCount++; });
  if(others.length===0) html+='<div id="other-exp-empty" style="font-size:13px;color:var(--MU);padding:4px 0">費用を追加するには上の「+ 追加」を押してください</div>';
  html+='</div></div>';

  document.getElementById('triprecform').innerHTML=html;
  updateGasCalc();
}

function buildOtherExpRow(idx,label,amount,targets) {
  var fams=S.fams;
  var html='<div class="other-exp-row" id="other-exp-row-'+idx+'">';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
  html+='<span style="font-size:12px;font-weight:700;color:var(--MU)">費用 '+(idx+1)+'</span>';
  html+='<button type="button" class="trh-del" onclick="removeOtherExp('+idx+')" style="padding:2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>';
  html+='</div>';
  html+='<div class="frow" style="margin-bottom:8px">';
  html+='<div class="fg" style="flex:2"><label class="fl">費用名</label><input type="text" id="oexp-label-'+idx+'" class="fi" value="'+esc(label)+'" placeholder="例: 昼食代"></div>';
  html+='<div class="fg"><label class="fl">金額（円）</label><input type="number" id="oexp-amt-'+idx+'" class="fi" value="'+(amount||'')+'" placeholder="0" min="0"></div>';
  html+='</div>';
  html+='<div class="fg"><label class="fl">対象者</label>';
  html+='<div class="member-toggle-wrap" id="oexp-targets-'+idx+'">';
  fams.forEach(function(f){
    var on=targets.indexOf(f)>=0;
    html+='<button type="button" class="mtog'+(on?' on':'')+'" onclick="toggleMember(this,\''+esc(f)+'\')">'+esc(f)+'</button>';
  });
  html+='</div></div>';
  html+='</div>';
  return html;
}

function addOtherExp() {
  var empty=document.getElementById('other-exp-empty');
  if(empty) empty.remove();
  var list=document.getElementById('other-exp-list');
  if(!list) return;
  var row=document.createElement('div');
  row.innerHTML=buildOtherExpRow(_otherExpCount,'',0,[]);
  list.appendChild(row.firstChild);
  _otherExpCount++;
}
function removeOtherExp(idx) {
  var row=document.getElementById('other-exp-row-'+idx);
  if(row) row.remove();
  var list=document.getElementById('other-exp-list');
  if(list&&!list.querySelector('.other-exp-row')){
    list.innerHTML='<div id="other-exp-empty" style="font-size:13px;color:var(--MU);padding:4px 0">費用を追加するには「+ 追加」を押してください</div>';
  }
}

function togglePassenger(btn) {
  btn.classList.toggle('on');
}
function toggleMember(btn) {
  btn.classList.toggle('on');
}

function onTRDateChange(val) {
  var etc=document.getElementById('tr-etc');
  if(etc) etc.checked=isETCDay(val);
  updateGasCalc();
}
function onTRDriverChange(val) {
  var feEl=document.getElementById('tr-fuel-eff');
  if(feEl) feEl.value=getFuelEff(val);
  updateGasCalc();
}
function toggleParkingInput() {
  var chk=document.getElementById('tr-parking-chk');
  var wrap=document.getElementById('tr-parking-wrap');
  if(wrap) wrap.style.display=chk&&chk.checked?'block':'none';
}
function updateGasCalc() {
  var p=parseFloat((document.getElementById('tr-gas-price')||{}).value)||0;
  var d=parseFloat((document.getElementById('tr-distance')||{}).value)||0;
  var fe=parseFloat((document.getElementById('tr-fuel-eff')||{}).value)||15;
  var rt=(document.getElementById('tr-roundtrip')||{}).checked;
  var totalDist=rt?d*2:d;
  var gas=(p>0&&totalDist>0&&fe>0)?Math.floor(p*totalDist/fe):0;
  var hwAmt=parseFloat((document.getElementById('tr-hw-amt')||{}).value)||0;
  var totalHw=rt?hwAmt*2:hwAmt;
  var etcOn=(document.getElementById('tr-etc')||{}).checked;
  var highway=etcOn?Math.floor(totalHw*0.7):totalHw;
  var el=document.getElementById('gas-calc-display');
  if(!el) return;
  var parts=[];
  if(gas>0) parts.push('ガソリン代'+(rt?' (往復)':'')+' ¥'+gas.toLocaleString());
  if(highway>0) parts.push('高速'+(rt?' (往復)':'')+(etcOn?' (ETC割引後)':'')+' ¥'+highway.toLocaleString());
  if(parts.length>0){ el.style.display='block'; el.textContent=parts.join(' + '); }
  else el.style.display='none';
}

function saveTripRecordForm() {
  if(!S.activeProj) return;
  var btn=document.getElementById('trsave-btn');
  if(btn){ btn.disabled=true; btn.style.opacity='.4'; }

  // Collect form data
  var date=(document.getElementById('tr-date')||{}).value||'';
  var purpose=(document.getElementById('tr-purpose')||{}).value||'';
  var dest=(document.getElementById('tr-dest')||{}).value||'';
  var driver=(document.getElementById('tr-driver')||{}).value||'';
  // Passengers
  var passEls=document.querySelectorAll('#tr-passengers .mtog.on');
  var passengers=Array.prototype.map.call(passEls,function(b){return b.textContent.trim();});
  var hwFrom=(document.getElementById('tr-hw-from')||{}).value||'';
  var hwTo=(document.getElementById('tr-hw-to')||{}).value||'';
  var highwaySec=hwFrom&&hwTo?(hwFrom+'→'+hwTo):(hwFrom||hwTo);
  var highwayAmt=parseInt((document.getElementById('tr-hw-amt')||{}).value)||0;
  var etcOn=(document.getElementById('tr-etc')||{}).checked?true:false;
  var roundTrip=(document.getElementById('tr-roundtrip')||{}).checked?true:false;
  var gasPrice=parseFloat((document.getElementById('tr-gas-price')||{}).value)||0;
  var distance=parseFloat((document.getElementById('tr-distance')||{}).value)||0;
  var fuelEff=parseFloat((document.getElementById('tr-fuel-eff')||{}).value)||15;
  var hasParking=(document.getElementById('tr-parking-chk')||{}).checked?true:false;
  var parkingAmt=hasParking?(parseInt((document.getElementById('tr-parking-amt')||{}).value)||0):0;
  // Other expenses
  var others=[];
  document.querySelectorAll('.other-exp-row').forEach(function(row){
    var id=row.id.replace('other-exp-row-','');
    var lbl=((document.getElementById('oexp-label-'+id)||{}).value||'').trim();
    var amt=parseInt((document.getElementById('oexp-amt-'+id)||{}).value)||0;
    var tgts=[];
    var tgtEls=document.querySelectorAll('#oexp-targets-'+id+' .mtog.on');
    tgtEls.forEach(function(b){ tgts.push(b.textContent.trim()); });
    if(lbl||amt>0) others.push({label:lbl,amount:amt,targets:tgts});
  });

  var data={
    'プロジェクトID': S.activeProj['ID'],
    '日付': date, '目的': purpose, '目的地': dest,
    '支払者': driver, '運転者': driver,
    '乗車メンバー': passengers.join(','),
    '高速区間': highwaySec, '高速料金': highwayAmt, 'ETC割引': etcOn,
    '往復': roundTrip,
    'ガソリン単価': gasPrice, '走行距離': distance, '燃費': fuelEff,
    '駐車場有無': hasParking, '駐車場料金': parkingAmt,
    'その他費用JSON': others.length>0?JSON.stringify(others):''
  };
  if(S.editRecordData){ data['ID']=S.editRecordData['ID']; data['_rowIndex']=S.editRecordData['_rowIndex']; }

  google.script.run
    .withSuccessHandler(function(r){
      if(btn){ btn.disabled=false; btn.style.opacity=''; }
      if(r&&r.success){
        data['ID']=r.id; data['_rowIndex']=r.rowIndex;
        if(!S.tripRecords) S.tripRecords={};
        if(!S.tripRecords[S.activeProj['ID']]) S.tripRecords[S.activeProj['ID']]=[];
        var recs=S.tripRecords[S.activeProj['ID']];
        var found=false;
        for(var i=0;i<recs.length;i++){
          if(recs[i]['ID']===data['ID']){ recs[i]=data; found=true; break; }
        }
        if(!found) recs.push(data);
        closeTripRecord();
        renderTripRecords();
        renderTrips();
        showToast('保存しました');
      }else{ showToast('保存失敗'); }
    })
    .withFailureHandler(function(e){
      if(btn){ btn.disabled=false; btn.style.opacity=''; }
      showToast('エラー: '+esc(String(e)));
    })
    .saveTripRecord(data);
}

function deleteTripRecordConfirm() {
  if(!S.editRecordData) return;
  showCon('記録を削除', 'この記録を削除します。よろしいですか？', true, function(){
    var row=S.editRecordData['_rowIndex'];
    var recId=S.editRecordData['ID'];
    google.script.run
      .withSuccessHandler(function(r){
        if(r&&r.success){
          var projId=S.activeProj['ID'];
          if(S.tripRecords&&S.tripRecords[projId]){
            S.tripRecords[projId]=S.tripRecords[projId].filter(function(rec){return rec['ID']!==recId;});
          }
          closeTripRecord();
          renderTripRecords();
          renderTrips();
          showToast('削除しました');
        }
      })
      .deleteTripRecord(row);
  }, 'danger');
}

function duplicateRecord(recId) {
  if(!S.activeProj) return;
  var recs=(S.tripRecords&&S.tripRecords[S.activeProj['ID']])||[];
  var orig=null;
  for(var i=0;i<recs.length;i++){if(recs[i]['ID']===recId){orig=recs[i];break;}}
  if(!orig) return;
  var copy={};
  var keys=['プロジェクトID','日付','目的','目的地','支払者','運転者','乗車メンバー','高速区間','高速料金','ETC割引','往復','ガソリン単価','走行距離','燃費','駐車場有無','駐車場料金','その他費用JSON'];
  keys.forEach(function(k){ copy[k]=orig[k]!==undefined?orig[k]:''; });
  copy['プロジェクトID']=S.activeProj['ID'];
  google.script.run
    .withSuccessHandler(function(r){
      if(r&&r.success){
        copy['ID']=r.id; copy['_rowIndex']=r.rowIndex;
        if(!S.tripRecords[S.activeProj['ID']]) S.tripRecords[S.activeProj['ID']]=[];
        S.tripRecords[S.activeProj['ID']].push(copy);
        renderTripRecords();
        renderTrips();
        showToast('記録を複製しました');
      }
    })
    .withFailureHandler(function(e){ showToast('複製失敗: '+esc(String(e))); })
    .saveTripRecord(copy);
}

// ── Car settings ──
function openCarSettings() {
  buildCarSettingsForm();
  document.getElementById('carsetov').classList.add('on');
}
function closeCarSettings() {
  document.getElementById('carsetov').classList.remove('on');
}
function buildCarSettingsForm() {
  var fams=S.fams;
  // Ensure we have entries for each family
  var settingsMap={};
  (S.carSettings||[]).forEach(function(c){ settingsMap[c['名前']]=c; });
  var html='';
  fams.forEach(function(f){
    var carName=f+'の車';
    var entry=settingsMap[carName]||{};
    var fe=parseFloat(entry['燃費'])||15;
    html+='<div class="carset-row">';
    html+='<div>';
    html+='<div class="carset-name">'+esc(carName)+'</div>';
    html+='<div style="font-size:11px;color:var(--MU)">'+esc(f)+'が運転する車</div>';
    html+='</div>';
    html+='<div style="display:flex;align-items:center;gap:6px">';
    html+='<input type="number" id="carfe-'+esc(f)+'" class="fi" style="width:70px;text-align:right;padding:8px 10px" value="'+fe+'" min="1" step="0.1">';
    html+='<span style="font-size:12px;color:var(--MU);white-space:nowrap">km/L</span>';
    html+='</div>';
    html+='</div>';
  });
  document.getElementById('carset-body').innerHTML=html;
}
function saveCarSettingsForm() {
  var fams=S.fams;
  var cars=fams.map(function(f){
    var fe=parseFloat((document.getElementById('carfe-'+f)||{}).value)||15;
    return {'名前':f+'の車','燃費':fe};
  });
  google.script.run
    .withSuccessHandler(function(r){
      if(r&&r.success){
        S.carSettings=cars;
        closeCarSettings();
        showToast('燃費設定を保存しました');
      }
    })
    .withFailureHandler(function(e){ showToast('エラー: '+esc(String(e))); })
    .saveCarSettings(cars);
}
